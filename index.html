body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(235,246,255,.20) 0%,rgba(238,247,255,.72) 42%,rgba(241,247,253,.96) 100%)}
.container{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:28px 0 55px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;color:#fff;text-shadow:0 2px 12px rgba(0,30,90,.35)}
.brand-main{font-size:25px;font-weight:900;letter-spacing:-.4px}.brand-main span{color:#13a0ff}.brand-sub{font-size:11px;color:rgba(255,255,255,.82);margin-top:2px}
.menu{border:1px solid rgba(255,255,255,.45);background:rgba(0,45,110,.24);color:#fff;border-radius:12px;width:44px;height:44px;font-size:21px;backdrop-filter:blur(12px)}
.hero{padding:20px 12px 28px;color:#fff;text-shadow:0 3px 18px rgba(0,27,85,.45)}
.kicker{font-size:13px;font-weight:800;letter-spacing:2px;color:#c9e8ff}.hero h1{margin:5px 0 6px;font-size:clamp(38px,6vw,68px);line-height:1;font-weight:950;letter-spacing:-2px}.hero h1 em{font-style:normal;color:#0d8dff}.hero p{margin:0;color:rgba(255,255,255,.9);font-size:15px}
.layout{display:grid;gap:18px}.panel{background:var(--panel);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);border-radius:18px;padding:20px;backdrop-filter:blur(18px)}
.panel-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.panel-title h2{margin:0;font-size:22px;font-weight:950}.panel-title small{font-size:10px;color:#7c8fa9;font-weight:800;letter-spacing:1px}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:rgba(255,255,255,.74);border:1px solid #d9e8f7;border-radius:15px;padding:18px 15px 14px;box-shadow:0 5px 20px rgba(45,100,160,.06);text-align:center}.card:nth-child(7){grid-column:2}.vpicon{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 10px}.vp{font-size:18px;font-weight:950;color:#13284c}.price{font-size:23px;font-weight:950;color:var(--orange);margin-top:5px}.qty{display:grid;grid-template-columns:42px 1fr 42px;margin-top:13px;height:40px;border:1px solid #d9e5f2;border-radius:10px;overflow:hidden;background:#eef5fb}.qty button{border:0;background:#e7f0f9;color:#16345c;font-size:22px;font-weight:900}.qty input{border:0;background:#f6faff;text-align:center;font-size:17px;font-weight:900;color:#14294b;outline:none;min-width:0}.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.qty input[type=number]{-moz-appearance:textfield}
.summary{display:grid;grid-template-columns:1.3fr .9fr;gap:12px}.summary-box{border:1px solid #d9e8f7;border-radius:13px;background:rgba(255,255,255,.7);padding:18px}.empty{text-align:center;color:#8395ad;padding:18px}.empty strong{display:block;color:#536985;font-size:16px;margin-bottom:5px}.summary-lines{display:grid;gap:11px}.sumrow{display:flex;justify-content:space-between;border-bottom:1px solid #e4edf6;padding-bottom:10px;color:#6d8099}.sumrow:last-child{border-bottom:0;padding-bottom:0}.sumrow strong{color:#172a4a}.sumrow.final{font-size:19px}.sumrow.final strong:last-child{color:var(--orange);font-size:27px}
.promo-row{display:grid;grid-template-columns:1fr 160px 1fr;gap:12px;align-items:center}.promo-input{height:46px;border:1px solid #cbddec;border-radius:10px;padding:0 13px;font-size:15px;background:rgba(255,255,255,.8);outline:none}.promo-input:focus{border-color:#158cff;box-shadow:0 0 0 3px rgba(21,140,255,.12)}.promo-btn{height:46px;border:0;border-radius:10px;background:#1688ff;color:#fff;font-size:16px;font-weight:900}.promo-ok{height:46px;border:1px solid #9fe1c3;border-radius:10px;background:#effcf5;color:#14945b;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #cbddec;background:rgba(255,255,255,.78);border-radius:10px;padding:12px 13px;font:inherit;color:#14284b;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#158cff;box-shadow:0 0 0 3px rgba(21,140,255,.11)}
.submit{width:100%;height:56px;border:0;border-radius:13px;background:linear-gradient(90deg,#087dff,#129eff);color:#fff;font-size:21px;font-weight:950;box-shadow:0 10px 28px rgba(0,126,255,.28)}.submit:disabled{opacity:.6}
.password-field{position:relative;display:flex;align-items:center}.password-field input{padding-right:64px}.password-toggle{position:absolute;right:10px;border:0;background:transparent;color:#71839d;font-size:13px;padding:6px}

function calc(){
  let totalQty=0,totalVp=0,original=0;
  PRODUCTS.forEach((p,i)=>{totalQty+=qty[i];totalVp+=qty[i]*p.vp;original+=qty[i]*p.price;});
  const code=document.getElementById("promo").value.trim().toUpperCase();
  let discount = 0;
  const promo = PROMO_CODES[code];

  if (promo && original > 0) {
    if (promo.type === "percent") discount = Math.round(original * promo.value / 100);
    else if (promo.type === "fixed") discount = Math.min(promo.value, original);
  }

  return {totalQty,totalVp,original,discount,final:original-discount};
}
function update(){
  const c=calc();
  document.getElementById("totalQty").textContent=c.totalQty+" 份";
  document.getElementById("totalVp").textContent=c.totalVp.toLocaleString()+" Robux";
  document.getElementById("original").textContent="NT$ "+c.original.toLocaleString();
  document.getElementById("discount").textContent="- NT$ "+c.discount.toLocaleString();
  document.getElementById("final").textContent="NT$ "+c.final.toLocaleString();
}
document.getElementById("promo").addEventListener("input",update);

document.getElementById("statusClose").addEventListener("click",()=>{
  document.getElementById("status").classList.remove("show");
  document.body.style.overflow="";
});

document.getElementById("status").addEventListener("click",(e)=>{
  if(e.target.id==="status"){
    e.currentTarget.classList.remove("show");
    document.body.style.overflow="";
  }
});

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){
    const status=document.getElementById("status");
    if(status.classList.contains("show")){
      status.classList.remove("show");
      document.body.style.overflow="";
    }
  }
});

document.getElementById("submitBtn").onclick=async()=>{
  // 每次實際送單只建立一次訂單編號
  if (!window.__LCVL_ORDER_NUMBER__) {
    window.__LCVL_ORDER_NUMBER__ = window.generateLCVLOrderNumber();
  }
  const orderNumber = window.__LCVL_ORDER_NUMBER__;

  const c=calc();
  if(c.totalQty===0){alert("請先選擇 Robux 數量");return;}
  const data=new URLSearchParams();

  // 訂單編號直接寫進現有「備註」欄，不新增 Google Form 欄位
  const noteEl = document.getElementById("note");
  const existingNote = noteEl ? noteEl.value.trim() : "";
  const finalNote = existingNote
    ? `訂單編號：${orderNumber}\n${existingNote}`
    : `訂單編號：${orderNumber}`;

  const detail=PRODUCTS.map((p,i)=>qty[i]?`${p.vp.toLocaleString()} Robux × ${qty[i]}`:null).filter(Boolean).join("、");
  const values={
    [ENTRY.detail]:detail,[ENTRY.totalQty]:c.totalQty,[ENTRY.totalVp]:c.totalVp,
    [ENTRY.riotUser]:document.getElementById("riotUser").value,[ENTRY.riotPass]:document.getElementById("riotPass").value,
    [ENTRY.valorantId]:document.getElementById("valorantId").value,[ENTRY.name]:document.getElementById("name").value,
    [ENTRY.contact]:document.getElementById("contact").value,[ENTRY.note]:finalNote,
    [ENTRY.original]:c.original,[ENTRY.discount]:c.discount,[ENTRY.promo]:document.getElementById("promo").value,
    [ENTRY.final]:c.final
  };
  Object.entries(values).forEach(([k,v])=>data.append(k,v));
  const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="送出中…";
  try{
    await fetch(FORM_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:data.toString()});
    const orderNumberEl = document.getElementById("orderNumber");
    if (orderNumberEl) {
      orderNumberEl.textContent = orderNumber;
    }
    const status=document.getElementById("status");
    status.classList.add("show");
    document.body.style.overflow="hidden";
  }catch(e){alert("送出失敗，請稍後再試");}
  finally{btn.disabled=false;btn.textContent="確認並下單";}
};
update();
</script>


<script>
document.addEventListener("DOMContentLoaded", function(){
  const input = document.getElementById("riotPass");
  const button = document.getElementById("toggleRiotPass");
  if (!input || !button) return;

  button.addEventListener("click", function(){
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    button.textContent = show ? "隱藏" : "顯示";
    button.setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
  });
});
</script>





<script id="lcvl-order-number">
(function () {
  const ORDER_PREFIX = "LC-RB";

  window.generateLCVLOrderNumber = function () {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let random = "";

    if (window.crypto && crypto.getRandomValues) {
      for (let i = 0; i < 5; i++) {
        random += chars[crypto.getRandomValues(new Uint32Array(1))[0] % chars.length];
      }
    } else {
      for (let i = 0; i < 5; i++) {
        random += chars[Math.floor(Math.random() * chars.length)];
      }
    }

    return `${ORDER_PREFIX}-${yy}${mm}${dd}-${random}`;
  };
})();
</script>
