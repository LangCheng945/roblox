<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喵喵儲值｜Robux 快速下單系統</title>
<style>
:root{--accent:#ffad43;--accent2:#ffd15c;--ink:#171717;--dark:#292929;--muted:#9b9b9b;--line:#e8e8e8;--bg:#f7f7f7;--white:#fff;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#222}
body{padding-bottom:118px}
button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.topbar{height:72px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eee;position:sticky;top:0;z-index:20}
.topbar .title{font-weight:800;font-size:20px;letter-spacing:.5px}
.topbar .sub{display:block;text-align:center;font-size:12px;color:#aaa;font-weight:600;margin-top:2px}
.steps{background:#fff;padding:17px 20px 14px;border-bottom:1px solid #eee;position:sticky;top:72px;z-index:19}
.step-row{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.step-row:before{content:"";position:absolute;left:10%;right:10%;top:17px;height:4px;background:#ededed;border-radius:999px}
.step{position:relative;text-align:center;color:#b9b9b9;font-weight:700;font-size:13px}
.step .dot{width:36px;height:36px;border-radius:50%;margin:0 auto 7px;background:#fff;border:3px solid #eee;display:grid;place-items:center;font-weight:800;color:#aaa;position:relative;z-index:2}
.step.active{color:var(--accent)}
.step.active .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.active:first-child + .step .dot{border-color:#eee}
.step.active:nth-child(2){color:var(--accent)}
.step.active:nth-child(2) .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.active:nth-child(2):before{content:"";position:absolute;left:-50%;right:50%;top:17px;height:4px;background:var(--accent);z-index:1}
.main{max-width:820px;margin:0 auto;padding:20px 20px 36px}
.section-title{font-size:22px;font-weight:850;margin:4px 0 16px}
.section-sub{font-size:12px;color:#999;margin-top:-10px;margin-bottom:16px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#303030;border-radius:8px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.10);border:1px solid #555}
.card-img{height:180px;background:linear-gradient(180deg,#1e1e1e,#252525);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:15px 15px 14px;color:#fff}
.card-name{font-size:20px;font-weight:800;margin-bottom:16px}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.price{font-size:20px;font-weight:850;color:var(--accent2)}
.qty{display:flex;align-items:center;background:#fff;border-radius:7px;overflow:hidden;height:46px}
.qty button{width:42px;height:46px;border:0;background:#fff;color:#333;font-size:25px;cursor:pointer}
.qty input{width:42px;height:46px;border:0;border-left:1px solid #eee;border-right:1px solid #eee;text-align:center;font-weight:800;outline:none;appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form-card{margin-top:24px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.form-title{font-size:18px;font-weight:850;margin-bottom:16px}
.fields{display:grid;gap:12px}
.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid #ddd;border-radius:7px;background:#fff;padding:12px 13px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,173,67,.14)}
.field textarea{min-height:80px;resize:vertical}
.summary{margin-top:16px;border-top:1px solid #eee;padding-top:15px;display:grid;gap:8px}
.sumrow{display:flex;justify-content:space-between;align-items:center;color:#666;font-size:14px}
.sumrow.total{font-size:18px;color:#222;font-weight:850;padding-top:5px}
.sumrow.total strong{color:#ef5b2a;font-size:27px}
.notice{font-size:12px;color:#888;line-height:1.7;margin-top:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #e8e8e8;padding:10px max(14px,calc((100vw - 820px)/2 + 14px));z-index:30}
.bottom-inner{display:flex;align-items:center;gap:10px}
.bottom-total{flex:1;min-width:0}
.bottom-total .label{font-size:12px;color:#999}
.bottom-total strong{display:block;font-size:23px;color:#ef5b2a;line-height:1.15}
.undo{width:52px;height:52px;border:0;background:#f5f5f5;border-radius:16px;font-size:28px;color:#555;cursor:pointer}
.next{width:58px;height:58px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;cursor:pointer;box-shadow:0 5px 16px rgba(255,173,67,.3)}
.next:disabled{opacity:.55}
.status{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:22px;z-index:50}
.status.show{display:flex}
.status-box{width:min(420px,100%);background:#fff;border-radius:16px;padding:28px 22px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.25)}
.status-mark{width:58px;height:58px;border-radius:50%;background:#e9f8ef;color:#27a05a;display:grid;place-items:center;margin:0 auto 14px;font-size:30px;font-weight:900}
.status-title{margin:0;font-size:23px}
.order{margin:15px 0;padding:12px;background:#f7f7f7;border-radius:9px}
.order span{display:block;font-size:11px;color:#999;margin-bottom:4px}
.order strong{font-size:19px;letter-spacing:1px}
.status-close{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:11px 28px;font-weight:800;cursor:pointer}
@media(max-width:600px){
 body{padding-bottom:112px}
 .topbar{height:62px} .steps{top:62px;padding:13px 8px 11px}
 .step{font-size:11px} .step .dot{width:32px;height:32px;font-size:12px;margin-bottom:5px}
 .step-row:before{top:15px;left:9%;right:9%;height:3px}
 .step.active:nth-child(2):before{top:15px}
 .main{padding:16px 12px 28px}
 .section-title{font-size:19px}
 .products{gap:10px}
 .card-img{height:150px}
 .card-body{padding:11px 10px 10px}
 .card-name{font-size:16px;margin-bottom:10px}
 .card-bottom{gap:6px;align-items:flex-end}
 .price{font-size:16px}
 .qty{height:38px}
 .qty button{height:38px;width:32px;font-size:20px}
 .qty input{height:38px;width:34px;font-size:14px}
 .form-card{padding:15px;margin-top:18px}
 .bottom{padding:9px 10px}
 .undo{width:50px;height:50px}
 .next{width:54px;height:54px}
}
</style>
</head>
<body>
<header class="topbar">
  <div><div class="title">喵喵儲值｜快速下單系統</div><div class="sub">Robux 儲值</div></div>
</header>
<nav class="steps" aria-label="下單流程">
  <div class="step-row">
    <div class="step active"><div class="dot">1</div>選遊戲</div>
    <div class="step active"><div class="dot">2</div>選面額</div>
    <div class="step"><div class="dot">3</div>填資料</div>
    <div class="step"><div class="dot">4</div>確認</div>
    <div class="step"><div class="dot">5</div>完成</div>
  </div>
</nav>
<main class="main">
  <h1 class="section-title">選擇 Robux 面額</h1>
  <div class="section-sub">SELECT ROBUX</div>
  <section class="products" id="products"></section>

  <section class="form-card">
    <div class="form-title">Roblox 帳號資訊</div>
    <div class="fields">
      <div class="field"><label>Roblox 帳號</label><input id="robloxUser" autocomplete="off" placeholder="請輸入 Roblox 帳號"></div>
      <div class="field"><label>Roblox 使用者名稱</label><input id="robloxName" autocomplete="off" placeholder="請輸入 Roblox 使用者名稱"></div>
      <div class="field"><label>稱呼</label><input id="name" autocomplete="off" placeholder="請輸入稱呼"></div>
      <div class="field"><label>聯絡方式</label><input id="contact" autocomplete="off" placeholder="Instagram / Discord / Email / 電話"></div>
      <div class="field"><label>優惠碼</label><input id="promo" autocomplete="off" placeholder="若有優惠碼請輸入"></div>
      <div class="field"><label>備註</label><textarea id="note" placeholder="其他需求或備註（選填）"></textarea></div>
    </div>
    <div class="summary">
      <div class="sumrow"><span>總數量</span><strong id="totalQty">0 份</strong></div>
      <div class="sumrow"><span>總 Robux</span><strong id="totalRobux">0 Robux</strong></div>
      <div class="sumrow"><span>原始金額</span><strong id="original">NT$ 0</strong></div>
      <div class="sumrow"><span>優惠金額</span><strong id="discount">- NT$ 0</strong></div>
      <div class="sumrow total"><span>應付金額</span><strong id="final">NT$ 0</strong></div>
    </div>
    <div class="notice">送出前請確認 Roblox 帳號與儲值面額正確。訂單送出後將由人工處理。</div>
  </section>
</main>

<div class="bottom">
  <div class="bottom-inner">
    <div class="bottom-total"><div class="label">總計</div><strong id="bottomFinal">NT$ 0</strong></div>
    <button class="undo" type="button" id="resetBtn" aria-label="清除數量">↶</button>
    <button class="next" type="button" id="submitBtn" aria-label="確認並下單">›</button>
  </div>
</div>

<div class="status" id="status" role="dialog" aria-modal="true">
  <div class="status-box">
    <div class="status-mark">✓</div>
    <h2 class="status-title">訂單已送出</h2>
    <div class="order"><span>訂單編號</span><strong id="orderNumber"></strong></div>
    <p>我們已收到您的訂單，後續將由人工進行處理。</p>
    <button class="status-close" id="statusClose" type="button">確定</button>
  </div>
</div>

const ENTRY = {
  detail:"entry.600550415", totalQty:"entry.1186878153", totalRobux:"entry.1672793174",
  account:"entry.56609666", username:"entry.389011351", name:"entry.204309634",
  contact:"entry.1397610446", note:"entry.55253798", original:"entry.1426957952",
  discount:"entry.1863658130", promo:"entry.1015304716", final:"entry.220689903"
};
const PROMO_CODES = { LANGCHENG97: {type:"percent", value:3, name:"LangCheng97"} };
const qty=Array(PRODUCTS.length).fill(0);
const productsEl=document.getElementById('products');
PRODUCTS.forEach((p,i)=>{
 const card=document.createElement('article');card.className='card';
 card.innerHTML=`<div class="card-img"><img src="${p.image}" alt="${p.robux.toLocaleString()} Robux"></div><div class="card-body"><div class="card-name">${p.robux.toLocaleString()} Robux</div><div class="card-bottom"><div class="price">NT$${p.price.toLocaleString()}</div><div class="qty"><button type="button" data-act="minus">−</button><input type="number" min="0" value="0" inputmode="numeric" aria-label="${p.robux} Robux 數量"><button type="button" data-act="plus">＋</button></div></div></div>`;
 const input=card.querySelector('input');
 card.querySelector('[data-act="minus"]').onclick=()=>{qty[i]=Math.max(0,qty[i]-1);input.value=qty[i];update();};
 card.querySelector('[data-act="plus"]').onclick=()=>{qty[i]++;input.value=qty[i];update();};
 input.oninput=()=>{qty[i]=Math.max(0,parseInt(input.value||0,10));input.value=qty[i];update();};
 productsEl.appendChild(card);
});
function calc(){let totalQty=0,totalRobux=0,original=0;PRODUCTS.forEach((p,i)=>{totalQty+=qty[i];totalRobux+=qty[i]*p.robux;original+=qty[i]*p.price;});const code=document.getElementById('promo').value.trim().toUpperCase();const promo=PROMO_CODES[code];let discount=0;if(promo&&original>0){if(promo.type==='percent')discount=Math.round(original*promo.value/100);else if(promo.type==='fixed')discount=Math.min(promo.value,original);}return {totalQty,totalRobux,original,discount,final:original-discount};}
function update(){const c=calc();document.getElementById('totalQty').textContent=c.totalQty+' 份';document.getElementById('totalRobux').textContent=c.totalRobux.toLocaleString()+' Robux';document.getElementById('original').textContent='NT$ '+c.original.toLocaleString();document.getElementById('discount').textContent='- NT$ '+c.discount.toLocaleString();document.getElementById('final').textContent='NT$ '+c.final.toLocaleString();document.getElementById('bottomFinal').textContent='NT$ '+c.final.toLocaleString();}
document.getElementById('promo').addEventListener('input',update);
document.getElementById('resetBtn').onclick=()=>{qty.fill(0);document.querySelectorAll('.qty input').forEach(i=>i.value=0);update();};
function orderNumber(){const now=new Date();const yy=String(now.getFullYear()).slice(-2),mm=String(now.getMonth()+1).padStart(2,'0'),dd=String(now.getDate()).padStart(2,'0');const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<5;i++)r+=chars[Math.floor(Math.random()*chars.length)];return `LC-RB-${yy}${mm}${dd}-${r}`;}
document.getElementById('submitBtn').onclick=async()=>{const c=calc();if(!c.totalQty){alert('請先選擇 Robux 面額');return;}const order=orderNumber();const note=document.getElementById('note').value.trim();const finalNote=`訂單編號：${order}`+(note?'\n'+note:'');const detail=PRODUCTS.map((p,i)=>qty[i]?`${p.robux.toLocaleString()} Robux × ${qty[i]}`:null).filter(Boolean).join('、');const data=new URLSearchParams();const values={[ENTRY.detail]:detail,[ENTRY.totalQty]:c.totalQty,[ENTRY.totalRobux]:c.totalRobux,[ENTRY.account]:document.getElementById('robloxUser').value,[ENTRY.username]:document.getElementById('robloxName').value,[ENTRY.name]:document.getElementById('name').value,[ENTRY.contact]:document.getElementById('contact').value,[ENTRY.note]:finalNote,[ENTRY.original]:c.original,[ENTRY.discount]:c.discount,[ENTRY.promo]:document.getElementById('promo').value,[ENTRY.final]:c.final};Object.entries(values).forEach(([k,v])=>data.append(k,v));const btn=document.getElementById('submitBtn');btn.disabled=true;try{await fetch(FORM_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data.toString()});document.getElementById('orderNumber').textContent=order;document.getElementById('status').classList.add('show');document.body.style.overflow='hidden';}catch(e){alert('送出失敗，請稍後再試');}finally{btn.disabled=false;}};
document.getElementById('statusClose').onclick=()=>{document.getElementById('status').classList.remove('show');document.body.style.overflow='';};
document.getElementById('status').onclick=e=>{if(e.target.id==='status')e.currentTarget.classList.remove('show');};
update();
</script>
