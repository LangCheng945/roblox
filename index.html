body:after{content:"";position:fixed;inset:0;background:
linear-gradient(120deg,transparent 0 18%,rgba(11,140,255,.045) 18.1%,transparent 18.3%),
linear-gradient(300deg,transparent 0 72%,rgba(130,90,255,.08) 72.1%,transparent 72.4%);
pointer-events:none;z-index:1}
a{color:inherit}
.container{width:min(1440px,calc(100% - 36px));margin:auto;position:relative;z-index:2}
header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.18);position:relative}
.brand{display:flex;flex-direction:column;gap:3px;letter-spacing:.22em}
.brand-main{font-weight:900;font-size:25px;letter-spacing:.08em}
.brand-sub{font-size:11px;color:#c8cfdf;letter-spacing:.38em}
.brand-main span{color:var(--red)}
.menu{display:none;width:42px;height:42px;border:1px solid var(--line);background:rgba(7,12,27,.65);color:#fff;font-size:23px}
.hero{padding:52px 0 26px}
.kicker{font-size:12px;letter-spacing:.42em;color:#cbd1df;margin-bottom:14px}
h1{margin:0;font-size:clamp(38px,5vw,70px);line-height:1;font-weight:950;letter-spacing:-.04em}
h1 em{font-style:normal;color:var(--red)}
.hero p{margin:15px 0 0;color:#d0d5df;font-size:16px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,.72fr);gap:18px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);padding:24px}
.panel:before{content:"";position:absolute;left:0;top:0;width:90px;height:3px;background:var(--red)}
.panel-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.panel-title h2{font-size:21px;margin:0;border-left:4px solid var(--red);padding-left:11px}
.panel-title small{color:#587296;letter-spacing:.28em}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{min-width:0;position:relative;background:rgba(248,251,255,.92);border:1px solid rgba(146,170,211,.25);padding:18px 14px 14px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:.18s}
.card:hover{border-color:rgba(11,140,255,.65);transform:translateY(-2px);box-shadow:0 10px 35px rgba(11,140,255,.08)}
.card:before{content:"";position:absolute;left:0;top:0;width:80px;height:3px;background:var(--red)}
.card-top{display:flex;gap:12px;align-items:center}
.vpicon{width:52px;height:52px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 0 6px rgba(255,255,255,.12))}
.vp{font-size:20px;font-weight:850}
.price{font-size:18px;color:#ff7a00;font-weight:850;margin-top:4px}
.qty{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:14px}
.qty button,.qty input{height:43px;border:1px solid rgba(160,180,220,.28);background:rgba(237,245,255,.95);color:#12203a;text-align:center;font-size:19px;font-weight:800}
.qty button{cursor:pointer}
.qty button:hover{border-color:var(--red);color:var(--red)}
.qty input{width:100%;outline:none}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input[type=number]{appearance:textfield;-moz-appearance:textfield}
.summary{position:sticky;top:16px;height:max-content}
.rows{margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(150,170,205,.22);color:#3d5576}
.row strong{color:#fff}
.row .accent{color:var(--red);font-weight:850}
.code-row{display:flex;align-items:center;gap:12px}
.code-row input{flex:1;min-width:0;height:40px;border:1px solid var(--line);background:rgba(248,251,255,.95);color:#12203a;padding:0 12px;font-size:15px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:17px;border-top:1px solid var(--red);font-size:21px;font-weight:900}
.total strong{font-size:32px;color:#ff7a00}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.field-panel{background:var(--panel2)}
.fields{display:grid;gap:11px}
.field{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:10px}
.field label{color:#3d5576;font-size:14px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:rgba(248,251,255,.94);color:#12203a;padding:11px 12px;outline:none;font:inherit}
.field textarea{min-height:43px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--red)}
.actions{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
.submit{border:0;min-height:64px;background:linear-gradient(105deg,#0b8cff,#24a0ff);color:#fff;font-size:22px;font-weight:950;cursor:pointer;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.notice{font-size:13px;line-height:1.8;color:#203452}
.notice h3{margin:0 0 8px;font-size:18px;color:#142a49;font-weight:900}
.notice li{color:#304968}
.notice ul{margin:0;padding-left:20px}
/* 送出成功彈窗 */
.status{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(3,6,15,.72);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:9999;
}
.status.show{display:flex}
.status-box{
  width:min(92vw,420px);padding:30px 26px 24px;
  background:rgba(10,16,32,.96);border:1px solid rgba(11,140,255,.5);
  box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.status-mark{
  width:54px;height:54px;margin:0 auto 16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--red);color:var(--red);font-size:28px;font-weight:800;
}
.status-title{margin:0 0 8px;font-size:24px;font-weight:900;color:#fff}
.status-text{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.7}
.status-close{
  width:100%;height:44px;border:1px solid rgba(11,140,255,.55);
  background:rgba(11,140,255,.1);color:#fff;font:inherit;font-weight:800;
  cursor:pointer;transition:.2s;
}
.status-close:hover{background:rgba(11,140,255,.2);border-color:var(--red)}

@media(max-width:900px){
 .container{width:min(100% - 20px,620px)}
 header{height:70px}
 .menu{display:block}
 .layout{grid-template-columns:1fr}
 .summary{position:static}
 .products{grid-template-columns:repeat(2,1fr)}
 .formgrid{grid-template-columns:1fr}
 .hero{padding:36px 0 20px}
}

<body>
<div class="container">
<header>
  <div class="brand"><div class="brand-main">連成代儲 <span>Robux</span></div><div class="brand-sub">ROBUX SUPPLY</div></div>
  <button class="menu" aria-label="選單">☰</button>
</header>

<section class="hero">
  <div class="kicker"></div>
  <h1>Robux <em>快速下單</em></h1>
  <p>快速下單 · 安全方便 · 人工處理</p>
</section>

<div class="layout">
<section class="panel">
  <div class="panel-title"><h2>選擇 Robux 數量</h2><small>SELECT ROBUX</small></div>
  <div class="products" id="products"></div>
</section>

<aside class="panel summary">
  <div class="panel-title"><h2>訂單摘要</h2><small>ORDER</small></div>
  <div class="rows">
    <div class="row"><span>總數量</span><strong class="accent" id="totalQty">0 份</strong></div>
    <div class="row"><span>總 Robux</span><strong class="accent" id="totalVp">0 Robux</strong></div>
    <div class="row"><span>原始金額</span><strong id="original">NT$ 0</strong></div>
    <div class="row code-row"><span>優惠碼</span><input id="promo" value="LANGCHENG" aria-label="優惠碼" placeholder="輸入優惠碼"></div>
    <div class="row"><span>優惠金額</span><strong style="color:#20d67b" id="discount">- NT$ 0</strong></div>
  </div>
  <div class="total"><span>應付金額</span><strong id="final">NT$ 0</strong></div>
</aside>
</div>

<div class="formgrid">
<section class="panel field-panel">
  <div class="panel-title"><h2>Roblox 帳號資訊</h2></div>
  <div class="fields">
    <div class="field"><label>Roblox 帳號</label><input id="riotUser" autocomplete="off" placeholder="請輸入 Roblox 帳號"></div>
    <div class="field">
  <label>帳號密碼</label>
  <div class="password-field">
    <input id="riotPass" type="password" autocomplete="off" placeholder="請輸入密碼">
    <button type="button" class="password-toggle" id="toggleRiotPass" aria-label="顯示密碼">顯示</button>
  </div>
</div>
    <div class="field"><label>Roblox ID</label><input id="valorantId" placeholder="例如：Player123"></div>
  </div>
</section>
<section class="panel field-panel">
  <div class="panel-title"><h2>聯絡資訊</h2></div>
  <div class="fields">
    <div class="field"><label>稱呼</label><input id="name" placeholder="例如：Chen"></div>
    <div class="field"><label>聯絡方式</label><input id="contact" placeholder="Instagram / Discord / Email / 電話"></div>
    <div class="field"><label>備註</label><textarea id="note" placeholder="其他需求或備註（選填）"></textarea></div>
  </div>
</section>
</div>

<div class="actions">
  <button class="submit" id="submitBtn">確認並下單</button>
  <section class="panel notice">
    <h3>注意事項</h3>
    <ul>
      <li>此為人工處理訂單，送出後會盡快為您處理。</li>
      <li>請確認帳號資訊正確，送出後無法修改。</li>
      <li>請確認帳號資訊正確，送出後無法修改。</li>
    </ul>
  </section>
</div>
</div>

<div class="status" id="status" role="dialog" aria-modal="true" aria-labelledby="statusTitle">
  <div class="status-box">
    <div class="status-mark">✓</div>
    <h2 class="status-title" id="statusTitle">訂單已送出</h2>
<div class="lcvl-order-number">
  <span>訂單編號</span>
  <strong id="orderNumber"></strong>

function calc(){
  let totalQty=0,totalVp=0,original=0;
  PRODUCTS.forEach((p,i)=>{totalQty+=qty[i];totalVp+=qty[i]*p.vp;original+=qty[i]*p.price;});
  const code=document.getElementById("promo").value.trim().toUpperCase();
  let discount = 0;
  const promo = PROMO_CODES[code];

  if (promo && original > 0) {
    if (promo.type === "percent") {
      discount = Math.round(original * promo.value / 100);
    } else if (promo.type === "fixed") {
      discount = Math.min(promo.value, original);
    }
  }

  return {totalQty,totalVp,original,discount,final:original-discount};
}
function update(){
  const c=calc();
  document.getElementById("totalQty").textContent=c.totalQty+" 份";
  document.getElementById("totalVp").textContent=c.totalVp.toLocaleString()+" Robux";
  document.getElementById("original").textContent="NT$ "+c.original.toLocaleString();
  document.getElementById("discount").textContent="- NT$ "+c.discount.toLocaleString();
  document.getElementById("final").textContent="NT$ "+c.final.toLocaleString();
}
document.getElementById("promo").addEventListener("input",update);

document.getElementById("statusClose").addEventListener("click",()=>{
  document.getElementById("status").classList.remove("show");
  document.body.style.overflow="";
});

document.getElementById("status").addEventListener("click",(e)=>{
  if(e.target.id==="status"){
    e.currentTarget.classList.remove("show");
    document.body.style.overflow="";
  }
});

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){
    const status=document.getElementById("status");
    if(status.classList.contains("show")){
      status.classList.remove("show");
      document.body.style.overflow="";
    }
  }
});

document.getElementById("submitBtn").onclick=async()=>{
  // 每次實際送單只建立一次訂單編號
  if (!window.__LCVL_ORDER_NUMBER__) {
    window.__LCVL_ORDER_NUMBER__ = window.generateLCVLOrderNumber();
  }
  const orderNumber = window.__LCVL_ORDER_NUMBER__;

  const c=calc();
  if(c.totalQty===0){alert("請先選擇 Robux 數量");return;}
  const data=new URLSearchParams();

  // 訂單編號直接寫進現有「備註」欄，不新增 Google Form 欄位
  const noteEl = document.getElementById("note");
  const existingNote = noteEl ? noteEl.value.trim() : "";
  const finalNote = existingNote
    ? `訂單編號：${orderNumber}\n${existingNote}`
    : `訂單編號：${orderNumber}`;

  const detail=PRODUCTS.map((p,i)=>qty[i]?`${p.vp.toLocaleString()} Robux × ${qty[i]}`:null).filter(Boolean).join("、");
  const values={
    [ENTRY.detail]:detail,[ENTRY.totalQty]:c.totalQty,[ENTRY.totalVp]:c.totalVp,
    [ENTRY.riotUser]:document.getElementById("riotUser").value,[ENTRY.riotPass]:document.getElementById("riotPass").value,
    [ENTRY.valorantId]:document.getElementById("valorantId").value,[ENTRY.name]:document.getElementById("name").value,
    [ENTRY.contact]:document.getElementById("contact").value,[ENTRY.note]:finalNote,
    [ENTRY.original]:c.original,[ENTRY.discount]:c.discount,[ENTRY.promo]:document.getElementById("promo").value,
    [ENTRY.final]:c.final
  };
  Object.entries(values).forEach(([k,v])=>data.append(k,v));
  const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="送出中…";
  try{
    await fetch(FORM_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:data.toString()});
    const orderNumberEl = document.getElementById("orderNumber");
    if (orderNumberEl) {
      orderNumberEl.textContent = orderNumber;
    }
    const status=document.getElementById("status");
    status.classList.add("show");
    document.body.style.overflow="hidden";
  }catch(e){alert("送出失敗，請稍後再試");}
  finally{btn.disabled=false;btn.textContent="確認並下單";}
};
update();
</script>

<script id="lcvl-order-number">
(function () {
  const ORDER_PREFIX = "LC-VL";

  window.generateLCVLOrderNumber = function () {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let random = "";

    if (window.crypto && crypto.getRandomValues) {
      for (let i = 0; i < 5; i++) {
        random += chars[crypto.getRandomValues(new Uint32Array(1))[0] % chars.length];
      }
    } else {
      for (let i = 0; i < 5; i++) {
        random += chars[Math.floor(Math.random() * chars.length)];
      }
    }

    return `${ORDER_PREFIX}-${yy}${mm}${dd}-${random}`;
  };
})();
</script>
